name: Security scanning

permissions:
  contents: read
  security-events: write

on:
  pull_request:
    branches: ["main", "dev"]

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config p/csharp --config p/security-audit --config p/owasp-top-ten --config p/secrets --sarif --output=semgrep.sarif --error

      - name: Upload Semgrep to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Prepare Unity Manifest for SCA
        run: |
          python << 'EOF'
          import json
          import os
          
          # Zoek automatisch naar de Packages/manifest.json, zelfs als deze in een submap staat
          manifest_path = None
          for root, dirs, files in os.walk('.'):
              if 'manifest.json' in files and 'Packages' in root:
                  manifest_path = os.path.join(root, 'manifest.json')
                  break
          
          if manifest_path:
              print(f"Unity manifest gevonden op: {manifest_path}")
              with open(manifest_path, 'r') as f:
                  data = json.load(f)
          
              dependencies = data.get('dependencies', {})
              xml_lines = ['<?xml version="1.0" encoding="utf-8"?>', '<packages>']
          
              for pkg_id, pkg_ver in dependencies.items():
                  # Soms is de versie een git-URL (zoals bij XCharts), we filteren de tag eruit
                  version = pkg_ver
                  if "#" in pkg_ver:
                      version = pkg_ver.split("#")[-1].lstrip("v")
                  elif "git" in pkg_ver or "http" in pkg_ver:
                      version = "0.0.0" # Fallback voor pure Git URL's
          
                  xml_lines.append(f'  <package id="{pkg_id}" version="{version}" targetFramework="net471" />')
          
              xml_lines.append('</packages>')
              output_path = os.path.join(os.path.dirname(manifest_path), 'packages.config')
          
              with open(output_path, 'w') as f:
                  f.write('\n'.join(xml_lines))
              print(f"Succesvol een packages.config gegenereerd voor Syft op: {output_path}!")
          else:
              print("FOUT: Kon Packages/manifest.json nergens vinden in de repository!")
          EOF

      - name: Generate SBOM
        run: syft dir:. -o cyclonedx-json > sbom.json

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run SCA
        run: grype sbom:sbom.json -o json > grype-report.json

      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: grype-report.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}